name: Validate MARP v0.1-v0.5

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marp-validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate MARP (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show environment
        run: |
          set -euo pipefail
          python --version
          python -m pip --version

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required files
        run: |
          set -euo pipefail

          required_files=(
            "requirements.txt"
            "scripts/validate_examples.py"
            "scripts/generate_v0.3_sources.py"
            "schemas/repair-record.schema.json"
            "schemas/repair-lifecycle-v0.2.schema.json"
            "schemas/repair-lineage-v0.3.schema.json"
            "schemas/hold-resolution-v0.3.schema.json"
            "schemas/repair-coordination-v0.4.schema.json"
            "schemas/repair-recovery-v0.5.schema.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "[FATAL] Missing required file: $file"
              exit 1
            fi

            echo "[FOUND] $file"
          done

          for version in v0.1 v0.2 v0.3 v0.4 v0.5; do
            for category in pass fail; do
              directory="examples/${version}/${category}"

              if [[ ! -d "$directory" ]]; then
                echo "[FATAL] Missing directory: $directory"
                exit 1
              fi

              echo "[FOUND] $directory"
            done
          done

      - name: Check Python syntax
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              Path("scripts/validate_examples.py"),
              Path("scripts/generate_v0.3_sources.py"),
          )

          for path in scripts:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )

              print(f"[syntax-ok] {path}")

          print("[PASS] Python syntax checks completed")
          PY

      - name: Validate JSON Schemas
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          files = (
              "schemas/repair-record.schema.json",
              "schemas/repair-lifecycle-v0.2.schema.json",
              "schemas/repair-lineage-v0.3.schema.json",
              "schemas/hold-resolution-v0.3.schema.json",
              "schemas/repair-coordination-v0.4.schema.json",
              "schemas/repair-recovery-v0.5.schema.json",
          )

          for filename in files:
              path = Path(filename)

              with path.open(encoding="utf-8") as stream:
                  schema = json.load(stream)

              Draft202012Validator.check_schema(schema)

              print(f"[schema-ok] {path}")

          print("[PASS] All MARP schemas are valid")
          PY

      - name: Check fixture counts
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          expected = {
              "v0.1": (4, 6),
              "v0.2": (6, 6),
              "v0.3": (6, 8),
              "v0.4": (6, 8),
              "v0.5": (6, 8),
          }

          total = 0
          total_pass = 0
          total_fail = 0

          for version, counts in expected.items():
              pass_count, fail_count = counts

              for category, count in (
                  ("pass", pass_count),
                  ("fail", fail_count),
              ):
                  directory = (
                      Path("examples")
                      / version
                      / category
                  )

                  if not directory.is_dir():
                      raise SystemExit(
                          f"[FATAL] Missing fixture directory: "
                          f"{directory}"
                      )

                  found = len(
                      list(directory.glob("*.json"))
                  )

                  print(
                      f"[fixtures] {version}/{category}: "
                      f"{found}/{count}"
                  )

                  if found != count:
                      raise SystemExit(
                          f"[FATAL] Unexpected fixture count: "
                          f"{directory}; "
                          f"expected={count}, found={found}"
                      )

                  total += found

                  if category == "pass":
                      total_pass += found
                  else:
                      total_fail += found

          if (
              total != 64
              or total_pass != 28
              or total_fail != 36
          ):
              raise SystemExit(
                  "[FATAL] Invalid fixture totals: "
                  f"total={total}, "
                  f"pass={total_pass}, "
                  f"fail={total_fail}"
              )

          print(
              "[PASS] 64 fixture files found "
              "(28 PASS / 36 FAIL)"
          )
          PY

      - name: Generate MARP v0.3 source fixtures
        run: |
          set -euo pipefail

          python scripts/generate_v0.3_sources.py \
            | tee marp-source-generation.log

      - name: Check generated source fixtures
        run: |
          set -euo pipefail

          python scripts/generate_v0.3_sources.py --check \
            | tee marp-source-check.log

      - name: Run MARP v0.1-v0.5 validation
        run: |
          set -euo pipefail

          python scripts/validate_examples.py \
            | tee marp-validation.log

      - name: Verify validation summary
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          log_path = Path("marp-validation.log")

          if not log_path.is_file():
              raise SystemExit(
                  "[FATAL] Validation log not found"
              )

          content = log_path.read_text(
              encoding="utf-8"
          )

          expected = {
              "Total": 64,
              "Matched": 64,
              "Mismatched": 0,
          }

          for label, target in expected.items():
              matches = re.findall(
                  rf"(?m)^{re.escape(label)}:\s*(\d+)\s*$",
                  content,
              )

              if len(matches) != 1:
                  raise SystemExit(
                      f"[FATAL] Invalid {label} summary"
                  )

              actual = int(matches[0])

              if actual != target:
                  raise SystemExit(
                      f"[FATAL] {label}: "
                      f"expected={target}, actual={actual}"
                  )

              print(f"[MATCH] {label}: {actual}")

          success_marker = (
              "[PASS] All MARP v0.1-v0.5 "
              "expectations matched"
          )

          if success_marker not in content:
              raise SystemExit(
                  "[FATAL] Success marker missing"
              )

          for version in (
              "v0.1",
              "v0.2",
              "v0.3",
              "v0.4",
              "v0.5",
          ):
              marker = f"[completed] {version}"

              if marker not in content:
                  raise SystemExit(
                      f"[FATAL] Missing version marker: "
                      f"{version}"
                  )

              print(f"[MATCH] Version: {version}")

          mismatch_lines = re.findall(
              r"(?m)^\[MISMATCH\].*$",
              content,
          )

          if mismatch_lines:
              raise SystemExit(
                  "[FATAL] Unexpected mismatch entries:\n"
                  + "\n".join(mismatch_lines)
              )

          print("[PASS] MARP integrated validation")
          PY

      - name: Publish job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          {
            echo "## MARP v0.1-v0.5 Validation"
            echo ""
            echo "- Python: \`${PYTHON_VERSION}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo "- Expected fixtures: **64**"
            echo ""
            echo "| Version | PASS fixtures | FAIL fixtures | Total |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| v0.1 | 4 | 6 | 10 |"
            echo "| v0.2 | 6 | 6 | 12 |"
            echo "| v0.3 | 6 | 8 | 14 |"
            echo "| v0.4 | 6 | 8 | 14 |"
            echo "| v0.5 | 6 | 8 | 14 |"
            echo "| **Total** | **28** | **36** | **64** |"
            echo ""

            if [[ -f marp-validation.log ]]; then
              echo "### Actual validation result"
              echo ""
              echo '```text'

              grep -E \
                '^(Total|Matched|Mismatched):|^\[PASS\]|^\[FAIL\]|^\[MISMATCH\]' \
                marp-validation.log || true

              echo '```'
            else
              echo "Validation summary unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marp-validation-logs-py${{ matrix.python-version }}
          path: |
            marp-source-generation.log
            marp-source-check.log
            marp-validation.log
          if-no-files-found: ignore
          retention-days: 7
