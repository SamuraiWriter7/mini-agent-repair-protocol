name: Validate MARP v0.1-v0.2

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marp-validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate MARP (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_examples.py

      - name: Check required files
        run: |
          set -euo pipefail

          test -f schemas/repair-record.schema.json
          test -f schemas/repair-lifecycle-v0.2.schema.json
          test -f scripts/validate_examples.py
          test -f requirements.txt

          test -d examples/v0.1/pass
          test -d examples/v0.1/fail
          test -d examples/v0.2/pass
          test -d examples/v0.2/fail

          echo "[PASS] Required MARP files exist"

      - name: Validate MARP v0.1 and v0.2
        run: |
          set -euo pipefail

          python scripts/validate_examples.py \
            | tee marp-validation.log

          grep -Eq 'Matched[[:space:]]*:[[:space:]]*22$' \
            marp-validation.log

          grep -Eq 'Mismatched[[:space:]]*:[[:space:]]*0$' \
            marp-validation.log

          echo "[PASS] All 22 MARP expectations matched"

      - name: Publish validation summary
        if: success()
        run: |
          {
            echo "## MARP Conformance Validation"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| v0.1 examples | 10 |"
            echo "| v0.2 examples | 12 |"
            echo "| Total expected matches | 22 |"
            echo "| Python | ${{ matrix.python-version }} |"
            echo "| Validation | PASS |"
            echo ""
            echo "### Validation Layers"
            echo "- JSON Schema Draft 2020-12"
            echo "- Semantic invariant checks"
            echo "- Authorization lifecycle checks"
            echo "- PASS/FAIL expectation matching"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marp-validation-python-${{ matrix.python-version }}
          path: marp-validation.log
          if-no-files-found: ignore
          retention-days: 7
